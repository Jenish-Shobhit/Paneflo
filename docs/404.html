<meta name="theme-color" content="#f6f7f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d0d" media="(prefers-color-scheme: dark)">
<script>
/* The appearance chosen on the main page (Light or Dark), or ?theme=light|dark|auto; otherwise the system's. */
(function () {
  var r = document.documentElement, t = null;
  try { t = localStorage.getItem("paneflo-theme"); } catch (e) {}
  var q = /[?&]theme=(light|dark|auto)(&|$)/.exec(location.search);
  if (q) t = q[1];
  if (t !== "light" && t !== "dark") return;
  r.setAttribute("data-theme", t);
  document.querySelector('meta[name="color-scheme"]').setAttribute("content", t);
  [].forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.setAttribute("content", t === "dark" ? "#0b0d0d" : "#f6f7f7"); });
})();
</script>
<style>
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}

:root{--bg:#f6f7f7;--ink:#0f1413;--ink2:#3c4442;--acc:#0b7563;--acc-ink:#fff;--acc-hi:#086253;

:root[data-theme="dark"]{--bg:#0b0d0d;--ink:#f2f5f4;--ink2:#bcc4c2;--acc:#43d1b6;--acc-ink:#00261f;--acc-hi:#6fe0ca;
  --h-grad:linear-gradient(180deg,#fff 35%,#aab7b4);
  --aurora:radial-gradient(40% 34% at 50% 52%,rgba(67,209,182,.34),rgba(67,209,182,0) 100%),radial-gradient(26% 40% at 24% 46%,rgba(31,140,120,.55),rgba(31,140,120,0) 100%),radial-gradient(28% 40% at 77% 58%,rgba(18,110,94,.7),rgba(18,110,94,0) 100%)}
*,*::before{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);letter-spacing:-.012em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* a quiet aurora under the copy, masked to a soft ellipse so it never reaches the edges */
body::before{content:"";position:fixed;left:50%;top:58%;z-index:-1;width:min(1100px,150vw);height:min(560px,80vh);transform:translate(-50%,-50%);background:var(--aurora);opacity:.6;-webkit-mask-image:radial-gradient(50% 50% at 50% 50%,#000 25%,transparent 80%);mask-image:radial-gradient(50% 50% at 50% 50%,#000 25%,transparent 80%);pointer-events:none}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px max(16px,env(safe-area-inset-left)) 56px}
img{display:block;width:72px;height:72px;filter:drop-shadow(0 10px 22px rgba(0,40,34,.28))}
h1{margin:26px 0 0;font:700 clamp(40px,7.4vw,76px)/.98 var(--disp);letter-spacing:-.047em;text-wrap:balance}
.g{background:var(--h-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;padding-bottom:.06em}
p{margin:18px 0 0;max-width:26em;color:var(--ink2);font-size:clamp(18px,1.9vw,21px);line-height:1.45;letter-spacing:-.016em;text-wrap:balance}
a{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;margin-top:32px;padding:0 26px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:17px;letter-spacing:-.012em;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 1px 2px rgba(0,0,0,.18),0 14px 34px -14px color-mix(in srgb,var(--acc) 80%,transparent);transition:background .2s,transform .2s var(--ease)}
a:hover{background:var(--acc-hi)}
a:active{transform:scale(.97)}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
a svg{width:18px;height:18px;flex:none}
@media (prefers-reduced-motion:no-preference){
  main>*{animation:rise .9s var(--ease) both}
  main>:nth-child(2){animation-delay:.07s}main>:nth-child(3){animation-delay:.16s}main>:nth-child(4){animation-delay:.24s}
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (forced-colors:active){
  .g{background:none;-webkit-text-fill-color:CanvasText;color:CanvasText}
  a{border:1px solid LinkText}
  body::before{display:none}
}
</style>
