<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found — Paneflo</title>
<link rel="icon" type="image/png" href="/Paneflo/favicon.png">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#fbfbfd;--ink:#1d1d1f;--ink2:#424245;--acc:#0b7563;--btn:#0b7563;--btn-ink:#fff;--btn-hi:#086253;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--ink2:#c7c7cc;--acc:#43d1b6;--btn:#43d1b6;--btn-ink:#00261f;--btn-hi:#6fe0ca}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{min-height:100%;display:grid;place-items:center;align-content:center;text-align:center;padding:32px 16px}
img{width:88px;height:88px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.16))}
h1{margin:24px 0 0;font:700 clamp(32px,6vw,44px)/1.06 var(--disp);letter-spacing:-.035em;text-wrap:balance}
p{margin:10px 0 0;color:var(--ink2);max-width:26em}
a{display:inline-flex;align-items:center;min-height:46px;margin-top:28px;padding:0 24px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;text-decoration:none}
a:hover{background:var(--btn-hi)}
a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/Paneflo/assets/icon-256.png" width="88" height="88" alt="Paneflo app icon">
  <h1>Page not found</h1>
  <p>This page may have moved, or the link may be mistyped.</p>
  <a href="https://jenish-shobhit.github.io/Paneflo/">Back to Paneflo</a>
</main>
</body>
</html>
