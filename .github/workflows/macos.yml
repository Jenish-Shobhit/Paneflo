name: macOS build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run core tests
        run: ./scripts/test.sh
      - name: Build and sign local app bundle
        run: ./scripts/build-app.sh
