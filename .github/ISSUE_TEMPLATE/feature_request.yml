name: Feature request
description: Suggest an improvement to Paneflo.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Paneflo to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Switcher
        - Tiling
        - Overview
        - Settings
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues.
          required: true
